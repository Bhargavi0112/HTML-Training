<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spring Shop</title>
<style>
  body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8}
  header{background:#232f3e;color:#fff;padding:14px 20px;display:flex;justify-content:space-between}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;padding:20px}
  .card{background:#fff;border-radius:8px;padding:12px;box-shadow:0 1px 4px #0002}
  .card img{width:100%;border-radius:6px}
  button{background:#ff9900;border:0;padding:8px 12px;border-radius:5px;cursor:pointer}
  #cart{background:#fff;margin:20px;padding:16px;border-radius:8px}
  input{padding:8px;margin:4px 0;width:100%;box-sizing:border-box}
</style>
</head>
<body>
<header><h2>🛒 Spring Shop</h2><span id="count"></span></header>
<div class="grid" id="products"></div>
<div id="cart">
  <h3>Your Cart</h3>
  <div id="items"></div>
  <h4 id="total"></h4>
  <input id="name" placeholder="Your name">
  <input id="address" placeholder="Address">
  <button onclick="checkout()">Checkout</button>
</div>
<script>
async function loadProducts(){
  const ps = await (await fetch('/api/products')).json();
  document.getElementById('products').innerHTML = ps.map(p=>`
    <div class="card"><img src="${p.imageUrl}">
    <h3>${p.name}</h3><p>${p.description}</p>
    <b>₹${p.price}</b> <small>(stock: ${p.stock})</small><br><br>
    <button onclick="add(${p.id})">Add to Cart</button></div>`).join('');
}
async function add(id){ await fetch('/api/cart/add/'+id+'?qty=1',{method:'POST'}); loadCart(); }
async function removeItem(id){ await fetch('/api/cart/'+id,{method:'DELETE'}); loadCart(); }
async function loadCart(){
  const items = await (await fetch('/api/cart')).json();
  let total = 0;
  document.getElementById('items').innerHTML = items.map(i=>{
    total += i.product.price*i.quantity;
    return `<p>${i.product.name} x${i.quantity} = ₹${i.product.price*i.quantity}
            <button onclick="removeItem(${i.id})">Remove</button></p>`}).join('') || '<p>Cart is empty</p>';
  document.getElementById('total').innerText = 'Total: ₹'+total;
  document.getElementById('count').innerText = items.length+' item(s) in cart';
}
async function checkout(){
  const r = await fetch('/api/orders/checkout',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:document.getElementById('name').value,address:document.getElementById('address').value})});
  if(r.ok){ alert('Order placed successfully!'); } else { alert(await r.text()); }
  loadProducts(); loadCart();
}
loadProducts(); loadCart();
</script>
</body>
</html>
